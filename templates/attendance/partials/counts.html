<div class="rounded-xl border bg-white p-3">
  <p class="text-xs text-gray-500">Present</p>
  <p class="text-xl font-semibold text-green-700">{{ counts.present }}</p>
</div>
<div class="rounded-xl border bg-white p-3">
  <p class="text-xs text-gray-500">Absent</p>
  <p class="text-xl font-semibold text-red-700">{{ counts.absent }}</p>
</div>
<div class="rounded-xl border bg-white p-3">
  <p class="text-xs text-gray-500">Late</p>
  <p class="text-xl font-semibold text-amber-600">{{ counts.late }}</p>
</div>
<div class="rounded-xl border bg-white p-3">
  <p class="text-xs text-gray-500">On leave</p>
  <p class="text-xl font-semibold text-blue-700">{{ counts.leave }}</p>
</div>
<div class="rounded-xl border bg-white p-3">
  <p class="text-xs text-gray-500">Unmarked</p>
  <p class="text-xl font-semibold text-gray-700">{{ counts.unmarked }} <span class="text-sm text-gray-400">/ {{ counts.total }}</span></p>
</div>
