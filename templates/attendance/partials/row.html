<tr id="row-{{ row.student.pk }}" class="border-t {% if row.record %}{% if row.record.status == 'A' %}bg-red-50{% elif row.record.status == 'L' %}bg-amber-50{% elif row.record.status == 'E' %}bg-blue-50{% endif %}{% endif %}">
  <td class="px-4 py-2 text-gray-500">{{ row.enrollment.roll_no }}</td>
  <td class="px-4 py-2">
    <a href="{% url 'attendance:student' row.student.pk %}" class="font-medium hover:underline">{{ row.student }}</a>
  </td>
  <td class="px-4 py-2">
    <div class="inline-flex rounded-lg border overflow-hidden">
      {% for code, label in statuses %}
        <button type="button" title="{{ label }}"
                {% if is_future %}disabled{% else %}
                hx-post="{% url 'attendance:mark' %}"
                hx-vals='{"student": "{{ row.student.pk }}", "status": "{{ code }}"}'
                {% endif %}
                class="px-3 py-1.5 text-xs font-semibold border-r last:border-r-0
                       {% if row.record and row.record.status == code %}
                         {% if code == 'P' %}bg-green-600 text-white{% elif code == 'A' %}bg-red-600 text-white{% elif code == 'L' %}bg-amber-500 text-white{% else %}bg-blue-600 text-white{% endif %}
                       {% else %}bg-white text-gray-600 hover:bg-gray-100{% endif %}
                       disabled:opacity-40">
          {{ code }}
        </button>
      {% endfor %}
    </div>
  </td>
  <td class="px-4 py-2">
    <input type="text" name="note" value="{{ row.record.note|default:'' }}" maxlength="200"
           placeholder="{% if row.record %}Optional note{% else %}Mark first{% endif %}"
           {% if not row.record or is_future %}disabled{% else %}
           hx-post="{% url 'attendance:mark' %}" hx-trigger="change"
           hx-vals='{"student": "{{ row.student.pk }}"}'
           {% endif %}
           class="w-full rounded border-gray-300 text-xs disabled:bg-gray-50">
  </td>
</tr>
