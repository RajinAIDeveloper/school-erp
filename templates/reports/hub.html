{% extends "layouts/base.html" %}{% block content %}
<div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
{% for item in links %}<a class="card card-body hover:border-indigo-300" href="{{ item.url }}"><h2 class="font-semibold text-indigo-700">{{ item.name }}</h2><p class="text-sm text-slate-600 mt-2">{{ item.description }}</p></a>
{% empty %}<p>No reports are available for this role.</p>{% endfor %}</div>{% endblock %}
