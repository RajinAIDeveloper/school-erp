{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign in</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center">
  <form method="post" class="w-full max-w-sm rounded-lg bg-white p-8 shadow">
    {% csrf_token %}
    <h1 class="mb-6 text-xl font-semibold">School ERP — Sign in</h1>
    {% if form.errors %}
      <p class="mb-4 text-sm text-red-600">Invalid username or password.</p>
    {% endif %}
    <label class="block mb-3 text-sm">Username
      <input name="username" required class="mt-1 w-full rounded border px-3 py-2">
    </label>
    <label class="block mb-6 text-sm">Password
      <input type="password" name="password" required class="mt-1 w-full rounded border px-3 py-2">
    </label>
    <button class="w-full rounded bg-slate-900 px-4 py-2 text-white hover:bg-slate-700">Sign in</button>
  </form>
</body>
</html>
