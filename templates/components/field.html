{% load erp %}
{% with wt=field|field_type %}
<div class="{% if wt == 'Textarea' or wt == 'CheckboxSelectMultiple' %}sm:col-span-2{% endif %}">
  {% if wt == 'CheckboxInput' %}
    <label class="flex items-center gap-2 pt-6 text-sm">{{ field }} <span>{{ label|default:field.label }}</span></label>
  {% else %}
    <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-slate-700">
      {{ label|default:field.label }}{% if field.field.required %}<span class="text-red-500"> *</span>{% endif %}
    </label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="mt-1 text-xs text-slate-500">{{ field.help_text|safe }}</p>{% endif %}
  {% for e in field.errors %}<p class="mt-1 text-xs text-red-600">{{ e }}</p>{% endfor %}
</div>
{% endwith %}
