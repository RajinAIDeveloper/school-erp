{% if form.non_field_errors %}
  <div class="mb-4 px-4 py-3 rounded bg-red-50 border border-red-200 text-red-700 text-sm">{{ form.non_field_errors }}</div>
{% endif %}
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
  {% for field in form %}
    <div class="{% if field.field.widget.input_type == 'textarea' or field.name == 'guardians' %}md:col-span-2{% endif %}">
      <label class="block text-sm font-medium text-gray-700 mb-1" for="{{ field.id_for_label }}">
        {{ field.label }}{% if field.field.required %} <span class="text-red-500">*</span>{% endif %}
      </label>
      {{ field }}
      {% if field.help_text %}<p class="text-xs text-gray-500 mt-1">{{ field.help_text }}</p>{% endif %}
      {% for error in field.errors %}<p class="text-xs text-red-600 mt-1">{{ error }}</p>{% endfor %}
    </div>
  {% endfor %}
</div>
