{% extends "base.html" %}
{% block page_title %}Enroll · {{ student.full_name }}{% endblock %}
{% block content %}
<div class="max-w-2xl bg-white rounded shadow p-6">
  <form method="post">{% csrf_token %}
    {% include "students/partials/form_fields.html" %}
    <div class="mt-6 flex gap-3">
      <button class="bg-blue-600 text-white px-5 py-2 rounded hover:bg-blue-700">Save</button>
      <a href="{% url 'students:detail' student.pk %}" class="px-5 py-2 border rounded hover:bg-gray-50">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
