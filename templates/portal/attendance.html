{% extends "layouts/base.html" %}{% block content %}
<form method="get" class="card card-body mb-4"><label class="label">Student</label><select class="input" name="student">{% for s in students %}<option value="{{ s.pk }}" {% if selected.pk == s.pk %}selected{% endif %}>{{ s.full_name }}</option>{% endfor %}</select><div class="mt-3"><label class="label">Month</label><input class="input" type="month" name="month" value="{{ month }}"></div><div class="flex gap-3 mt-4"><button class="btn-primary">View</button><button name="format" value="csv" class="btn-secondary">CSV</button></div></form>
{% if selected %}<div class="card overflow-x-auto"><table class="table"><thead><tr><th>Date</th><th>Status</th><th>Remarks</th></tr></thead><tbody>{% for r in records %}<tr><td>{{ r.date }}</td><td>{{ r.get_status_display }}</td><td>{{ r.remarks }}</td></tr>{% empty %}<tr><td>No attendance recorded for this month.</td></tr>{% endfor %}</tbody></table></div>{% endif %}
{% endblock %}
