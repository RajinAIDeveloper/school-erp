{% extends "layouts/base.html" %}
{% load erp %}
{% block content %}
<div class="card mx-auto max-w-4xl">
  <form method="post" enctype="multipart/form-data" class="card-body">
    {% csrf_token %}
    {% block form_body %}{% render_form form %}{% endblock %}
    <div class="mt-6 flex items-center justify-end gap-3 border-t border-slate-200 pt-4">
      {% if cancel_url %}<a href="{{ cancel_url }}" class="btn-secondary">Cancel</a>{% endif %}
      <button type="submit" class="btn-primary">{{ submit_label|default:"Save" }}</button>
    </div>
  </form>
</div>
{% endblock %}
